<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="体重小本本">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<title>双人体重小本本</title>
<script>
/* 自愈机制：版本变化时自动清掉手机上的旧缓存/旧SW，用户无感 */
(function(){
  try{
    var BUILD='v60a-20261005';
    if(localStorage.getItem('wt_build')!==BUILD){
      localStorage.setItem('wt_build',BUILD);
      if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})});}
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})});}
      setTimeout(function(){location.reload()},400);
    }
  }catch(e){}
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="styles.css?v=8j">
</head>
<body>
<div id="app">
<main>

  <!-- 记录 -->
  <section id="page-record" class="page active">
    <div class="page-head">
      <h1>体重</h1>
      <button class="icon-btn" data-action="open-settings" aria-label="设置" style="background:transparent">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.1"/>
          <path d="M19.4 15a1.68 1.68 0 0 0 .34 1.85l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.68 1.68 0 0 0-1.85-.34 1.68 1.68 0 0 0-1.02 1.54V21a2 2 0 1 1-4 0v-.09a1.68 1.68 0 0 0-1.1-1.54 1.68 1.68 0 0 0-1.85.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.68 1.68 0 0 0 .34-1.85 1.68 1.68 0 0 0-1.54-1.02H3a2 2 0 1 1 0-4h.09a1.68 1.68 0 0 0 1.54-1.1 1.68 1.68 0 0 0-.34-1.85l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.68 1.68 0 0 0 1.85.34h.08a1.68 1.68 0 0 0 1.02-1.54V3a2 2 0 1 1 4 0v.09a1.68 1.68 0 0 0 1.02 1.54 1.68 1.68 0 0 0 1.85-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.68 1.68 0 0 0-.34 1.85v.08a1.68 1.68 0 0 0 1.54 1.02H21a2 2 0 1 1 0 4h-.09a1.68 1.68 0 0 0-1.54 1.02z"/>
        </svg>
      </button>
    </div>
    <div class="date-row">
      <button class="date-chip" id="date-chip" data-action="open-datesheet"></button>
      <button class="linklike" data-action="goto-today" id="btn-today" style="display:none">回到今天</button>
    </div>
    <div id="makeup-box"></div>
    <div id="record-card"></div>
    <div id="hero-row"></div>

    <div id="record-extra"></div>
  </section>

  <!-- 趋势 -->
  <section id="page-trend" class="page">
    <div class="page-head"><h1>趋势</h1></div>
    <div id="chart-box"></div>
    <div id="cal-box"></div>
    <div id="goal-box"></div>
    <div id="waist-chart-box"></div>
    <div id="bf-chart-box"></div>
    <div id="range-summary"></div>
  </section>

  <!-- 统计 -->
  <section id="page-stats" class="page">
    <div class="page-head"><h1>统计</h1></div>
    <div id="stats-body"></div>
  </section>

  <section id="page-tools" class="page">
    <div class="page-head"><h1>工具</h1></div>
    <div id="tools-body"></div>
  </section>

</main>

<nav id="tabbar">
  <button class="tab active" data-page="record">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M12 8.2v7.6M8.2 12h7.6"/></svg>
    <span>记录</span>
  </button>
  <button class="tab" data-page="trend">

  </button>
  <button class="tab" data-page="stats">

  </button>
</nav>
</div>

<div id="toast"></div>

<!-- 设置抽屉 -->

<!-- 周计划选择（V31） -->
<div class="sheet" id="plan-sheet">

    <button class="icon-btn" data-action="close-plan" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="plan-body"></div>
</div>

<!-- 首页卡片设置（V21 仪表卡自定义） -->
<div class="sheet" id="hero-sheet">
  <div class="sheet-head">
    <span class="sheet-title">首页卡片设置</span>
    <button class="icon-btn" data-action="close-heroset" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="heroset-body"></div>
</div>

<!-- 日期选择（自绘，替代系统日期控件） -->
<div class="sheet" id="date-sheet">
  <div class="sheet-head">
    <span class="sheet-title">选择日期</span>
    <button class="icon-btn" data-action="close-datesheet" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>

  </div>

</div>

<!-- 设置抽屉 -->
<div class="sheet" id="settings-sheet">
  <div class="sheet-head">
    <span class="sheet-title">设置</span>
    <button class="icon-btn" data-action="close-settings" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="settings-body"></div>
</div>

<!-- 确认弹窗 -->
<div class="modal-wrap" id="modal-wrap">
  <div class="modal-bg" data-action="modal-cancel"></div>
  <div class="modal-box">
    <p id="modal-msg"></p>
    <div class="modal-btns">
      <button class="mbtn" data-action="modal-cancel">取消</button>
      <button class="mbtn ok" data-action="modal-ok">确定</button>
    </div>
  </div>
</div>

<script src="app.js?v=8j"></script>
</body>
</html>
